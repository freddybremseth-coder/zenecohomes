name: Validate ZenEcoHomes article deploy
on:
  pull_request:
    paths:
      - 'src/lib/content.ts'
      - 'src/lib/magazine.ts'
      - 'src/components/ArticleView.tsx'
      - 'src/app/guide/**'
      - 'scripts/seo-*.mjs'
      - '.github/workflows/article-build-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/content.ts'
      - 'src/lib/magazine.ts'
      - 'src/components/ArticleView.tsx'
      - 'src/app/guide/**'
      - 'scripts/seo-*.mjs'
      - '.github/workflows/article-build-validation.yml'
permissions:
  contents: read
jobs:
  seo-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate SEO metadata and internal links
        run: npm run seo:audit
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Validate production build
        run: npm run build
