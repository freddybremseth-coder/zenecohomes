<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Boligmarked og timing">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeef0"/><stop offset="1" stop-color="#eef5f3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#mBg)"/>
  <!-- rising market bars -->
  <g>
    <rect x="150" y="520" width="110" height="150" rx="8" fill="#9fc0c2"/>
    <rect x="300" y="440" width="110" height="230" rx="8" fill="#6fa7ab"/>
    <rect x="450" y="360" width="110" height="310" rx="8" fill="#3f7f86"/>
    <rect x="600" y="270" width="110" height="400" rx="8" fill="#1c6d87"/>
  </g>
  <!-- trend arrow -->
  <path d="M170 470 L360 400 L520 320 L690 220" fill="none" stroke="#c5a059" stroke-width="10" stroke-linecap="round"/>
  <path d="M690 220 l-46 6 l24 40 Z" fill="#c5a059"/>
  <!-- clock -->
  <circle cx="950" cy="300" r="120" fill="#16222b"/>
  <circle cx="950" cy="300" r="120" fill="none" stroke="#c5a059" stroke-width="6"/>
  <line x1="950" y1="300" x2="950" y2="215" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <line x1="950" y1="300" x2="1010" y2="330" stroke="#c5a059" stroke-width="9" stroke-linecap="round"/>
  <circle cx="950" cy="300" r="10" fill="#ffffff"/>
</svg>
