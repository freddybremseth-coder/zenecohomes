<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Boliglån i spansk bank">
  <defs>
    <linearGradient id="lBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eee2"/><stop offset="1" stop-color="#f6f2e8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#lBg)"/>
  <circle cx="990" cy="185" r="64" fill="#e6d3a6" opacity="0.7"/>
  <!-- house -->
  <g>
    <path d="M180 400 L380 250 L580 400 Z" fill="#c5a059"/>
    <rect x="235" y="400" width="290" height="250" fill="#ffffff" stroke="#ddd3c2" stroke-width="4"/>
    <rect x="290" y="470" width="80" height="80" rx="6" fill="#bcd6cb"/>
    <rect x="400" y="470" width="80" height="80" rx="6" fill="#bcd6cb"/>
    <rect x="330" y="570" width="90" height="80" fill="#7a5a3a"/>
  </g>
  <!-- bank pillars + roof (loan) -->
  <g fill="#2f5d7a">
    <path d="M640 380 L840 300 L1040 380 Z"/>
    <rect x="660" y="400" width="34" height="180"/><rect x="726" y="400" width="34" height="180"/><rect x="792" y="400" width="34" height="180"/><rect x="858" y="400" width="34" height="180"/><rect x="924" y="400" width="34" height="180"/><rect x="990" y="400" width="34" height="180"/>
    <rect x="640" y="592" width="400" height="30"/>
  </g>
  <!-- percent badge -->
  <g transform="translate(840 660)">
    <circle cx="0" cy="0" r="66" fill="#16222b"/>
    <text x="0" y="24" text-anchor="middle" fill="#c5a059" font-family="Georgia, serif" font-size="70" font-weight="700">%</text>
  </g>
  <!-- link between house and bank -->
  <path d="M540 520 H640" stroke="#c5a059" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/>
</svg>
